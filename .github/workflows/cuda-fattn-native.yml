name: CUDA FA native quants

# Compile the coupling axes of the quantized-native MMA FlashAttention route.
#
# Two build switches change this route's generated code, and nothing else in CI
# crosses them:
#
#   GGML_CUDA_KVARN          KVarN launches the same MMA kernel entry, so a
#                            change to that entry's signature reaches KVarN call
#                            sites that an OFF build never compiles.
#   GGML_CUDA_FA_ALL_QUANTS  decides which cache types get kernels at all, and
#                            with them every runtime V-loader switch arm, extern
#                            declaration and generated instance file.
#
# The failure this guards against is a build/inventory failure, not a wrong
# result: an earlier extern-macro mistake instantiated hundreds of full
# attention kernels in one translation unit, and every runtime test still
# passed. So each job also reads the built library back and checks its kernel
# inventory against the type manifest, and records object and library size.
#
# The focused FLASH_ATTN_EXT run needs a GPU, which GitHub-hosted runners do not
# have. It is defined here and runs only where a CUDA self-hosted runner is
# registered; see the job comment.

on:
  pull_request:
    paths:
      - 'ggml/src/ggml-cuda/**'
      - 'ggml/CMakeLists.txt'
      - 'tests/test-backend-ops.cpp'
      - 'scripts/fattn-native-inventory.py'
      - '.github/workflows/cuda-fattn-native.yml'
  push:
    branches:
      - 'beellama/dev'
      - 'beellama/main'
    paths:
      - 'ggml/src/ggml-cuda/**'
      - 'ggml/CMakeLists.txt'
      - 'tests/test-backend-ops.cpp'
      - 'scripts/fattn-native-inventory.py'
      - '.github/workflows/cuda-fattn-native.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  compile-matrix:
    name: Compile KVARN=${{ matrix.kvarn }} ALL_QUANTS=${{ matrix.all_quants }}
    runs-on: ubuntu-24.04
    container: nvidia/cuda:13.1.1-devel-ubuntu24.04
    # The all-quants arm compiles 1,056 explicit cases. Give it room, but stay
    # inside GitHub's 6 h ceiling so a timeout is reported rather than killed.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - kvarn: 'OFF'
            all_quants: 'OFF'
            slug: kvarn-off-allq-off
          - kvarn: 'ON'
            all_quants: 'OFF'
            slug: kvarn-on-allq-off
          - kvarn: 'OFF'
            all_quants: 'ON'
            slug: kvarn-off-allq-on
          - kvarn: 'ON'
            all_quants: 'ON'
            slug: kvarn-on-allq-on
    steps:
      - name: Dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake ninja-build ccache git python3 binutils

      - name: Clone
        uses: actions/checkout@v6

      - name: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: cuda-fattn-native-${{ matrix.slug }}
          restore-keys: cuda-fattn-native-${{ matrix.slug }}
          max-size: 5G
          sloppiness: time_macros

      - name: Configure
        # One real architecture on purpose. The point of this job is the source
        # inventory and the coupling between the two switches, and both are
        # architecture independent; compiling the default architecture list would
        # multiply the nvcc work for no extra coverage.
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_NATIVE=OFF \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA=ON \
            -DGGML_CUDA_KVARN=${{ matrix.kvarn }} \
            -DGGML_CUDA_FA_ALL_QUANTS=${{ matrix.all_quants }} \
            -DCMAKE_CUDA_ARCHITECTURES=89-real \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_TOOLS=OFF \
            -DLLAMA_CURL=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache

      - name: Build ggml-cuda
        run: cmake --build build --target ggml-cuda -j "$(nproc)"

      - name: Kernel inventory
        run: |
          LIB=$(find build -name 'libggml-cuda.so' -print -quit)
          test -n "$LIB"
          ARGS=""
          if [ "${{ matrix.all_quants }}" = "ON" ]; then ARGS="--all-quants"; fi
          python3 scripts/fattn-native-inventory.py "$LIB" $ARGS \
            --json "inventory-${{ matrix.slug }}.json"

      - name: Object and library size
        run: |
          LIB=$(find build -name 'libggml-cuda.so' -print -quit)
          {
            echo "### KVARN=${{ matrix.kvarn }} ALL_QUANTS=${{ matrix.all_quants }}"
            echo
            echo "libggml-cuda.so: $(stat -c %s "$LIB") bytes"
            echo
            echo "Largest native MMA objects:"
            find build -name 'fattn-mma-quant-instance-*.o' -printf '%s %p\n' \
              | sort -rn | head -10
            echo
            echo "Native MMA object count: $(find build -name 'fattn-mma-quant-instance-*.o' | wc -l)"
            echo "Native MMA object bytes: $(find build -name 'fattn-mma-quant-instance-*.o' -printf '%s\n' | paste -sd+ | bc)"
          } | tee "size-${{ matrix.slug }}.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: cuda-fattn-native-${{ matrix.slug }}
          path: |
            inventory-${{ matrix.slug }}.json
            size-${{ matrix.slug }}.txt

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: ${{ success() || cancelled() }}
        uses: ./.github/actions/save-rolling-ccache
        with:
          key: cuda-fattn-native-${{ matrix.slug }}
          ref: refs/heads/beellama/dev
          evict-old-files: 7d

  focused-test:
    name: Focused FLASH_ATTN_EXT native route
    needs: compile-matrix
    # GitHub-hosted runners have no GPU, so this cannot run there. It executes
    # only where the repository has a CUDA self-hosted runner registered and the
    # repository variable CUDA_SELF_HOSTED_RUNNER is set to 'true'; otherwise it
    # is skipped, which is reported as skipped rather than as a pass.
    if: ${{ vars.CUDA_SELF_HOSTED_RUNNER == 'true' }}
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - kvarn: 'OFF'
            all_quants: 'OFF'
            slug: kvarn-off-allq-off
          - kvarn: 'OFF'
            all_quants: 'ON'
            slug: kvarn-off-allq-on
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Build test-backend-ops
        run: |
          cmake -S . -B build-test -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_FA=ON \
            -DGGML_CUDA_KVARN=${{ matrix.kvarn }} \
            -DGGML_CUDA_FA_ALL_QUANTS=${{ matrix.all_quants }} \
            -DLLAMA_CURL=OFF
          cmake --build build-test --target test-backend-ops -j "$(nproc)"

      - name: Focused native-quant coverage
        # Both routes are exercised in one run: the compiled tier takes the
        # native path and the rest fall back to the F16-casting path, which is
        # why the extra-tier cases are in the sweep even in a default build.
        env:
          GGML_CUDA_FATTN_NATIVE_VERBOSE: '1'
        run: |
          ./build-test/bin/test-backend-ops -b CUDA0 -o FLASH_ATTN_EXT -p "native_quants=1"
